name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
        - 12.1
        required: true
        default: 12.1
      DEVICE_NAME:
        description: Device Name
        required: true
        default: berlna

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev \
          libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
          liblz4-tool libncurses-dev libsdl1.2-dev libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev android-sdk-libsparse-utils

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone https://github.com/SyberHexen/android_device_motorola_berlna-twrp -b twrp-12.1 device/motorola/berlna
      working-directory: workspace

    - name: Fix display driver issue
      run: |
        echo "" >> device/motorola/berlna/BoardConfig.mk
        echo "# Fix black screen issue" >> device/motorola/berlna/BoardConfig.mk
        echo "TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888" >> device/motorola/berlna/BoardConfig.mk
        echo "RECOVERY_GRAPHICS_USE_PREBUILT_FRAMEBUFFER := true" >> device/motorola/berlna/BoardConfig.mk
        echo "Done! Last 5 lines of BoardConfig.mk:"
        tail -5 device/motorola/berlna/BoardConfig.mk
      working-directory: workspace

    - name: Building TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_PREBUILT_KERNEL=device/motorola/berlna/prebuilt/Image
        lunch twrp_berlna-eng
        make adbd bootimage -j$(nproc --all)
      working-directory: workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/berlna/boot.img
          workspace/device/motorola/berlna/prebuilt/dtb.img
          workspace/device/motorola/berlna/prebuilt/dtbo.img
        name: berlna TWRP v2 Display Fix
        tag_name: ${{ github.run_id }}
        body: |
          Motorola Edge 2021 berlna TWRP
          Fixed display black screen issue
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

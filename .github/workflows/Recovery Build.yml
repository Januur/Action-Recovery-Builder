name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
        - 12.1
        - 11
        - 9.0
        - 8.1
        - 7.1
        - 6.0
        required: true
        default: 12.1
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/SyberHexen/android_device_motorola_berlna-twrp
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: twrp-12.1
      DEVICE_PATH:
        description: Path the device tree should be synced to, relative to source root
        required: true
        default: device/motorola/berlna
      DEVICE_NAME:
        description: Device Name
        required: true
        default: berlna
      BUILD_TARGET:
        type: choice
        description: Build Target
        options:
        - boot
        - recovery
        - vendor_boot
        required: true
        default: recovery

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    steps:
    - name: Display Run Parameters
      run: |
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev \
          libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev \
          liblz4-tool libncurses-dev libsdl1.2-dev libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
          qemu-user-static libstdc++-10-dev android-sdk-libsparse-utils

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-${{ inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} device/motorola/berlna
      working-directory: workspace

    - name: Building TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export TARGET_PREBUILT_KERNEL=device/motorola/berlna/prebuilt/Image
        lunch twrp_berlna-eng
        make adbd bootimage -j$(nproc --all)
      working-directory: workspace

    - name: Check output files
      run: |
        echo "=== Output files ==="
        find out/target/product/berlna/ -maxdepth 1 -type f | head -30
        echo "=== IMG files anywhere ==="
        find out/target/product/berlna/ -name "*.img" | head -20
      working-directory: workspace

    - name: Upload to Release
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/berlna/boot.img
          workspace/out/target/product/berlna/recovery.img
          workspace/device/motorola/berlna/prebuilt/dtb.img
          workspace/device/motorola/berlna/prebuilt/dtbo.img
        name: berlna (TWRP)
        tag_name: ${{ github.run_id }}
        body: |
          Motorola Edge 2021 (berlna) TWRP
          Manifest: ${{ inputs.MANIFEST_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
